<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Maimouni Mohammed — ingénieur informatique et cybersécurité</title>
  <desc id="desc">Bannière de profil dans un style cybersécurité sombre, avec motif de réseau et emblème de bouclier.</desc>
  <defs>
